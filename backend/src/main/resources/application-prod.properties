# =====================================================
# PRODUCTION CONFIG — Render + Neon PostgreSQL
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All values come from Render environment variables
# =====================================================

# Database — Neon PostgreSQL (overridden by Render env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway handles all schema; Hibernate must NOT touch schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Flyway — ENABLED in prod (Neon starts empty, Flyway runs V1+V2)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# HikariCP — tuned for Neon free tier
# Neon suspends compute after 5 min idle; keep pool small to avoid
# waking multiple connections at once.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
# Neon requires SSL; keepalive pings prevent connections going stale
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-test-query=SELECT 1

# Disable devtools
spring.devtools.restart.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.knowledgehub=INFO

# Web — Network Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
