# =====================================================
# PRODUCTION CONFIG — Render + Neon PostgreSQL
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All values come from Render environment variables
# =====================================================

# Database — Neon PostgreSQL (overridden by Render env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway handles all schema; Hibernate must NOT touch schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Flyway — ENABLED in prod (Neon starts empty, Flyway runs V1+V2)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# HikariCP — tuned for Neon (upgrade from free tier for 500 users)
# Formula: pool_size = (core_count * 2) + effective_spindle_count
# Render Standard = 1 CPU → pool size 10-20 is optimal
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-test-query=SELECT 1

# Tomcat — tune thread pool for 500 concurrent requests
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# Disable devtools
spring.devtools.restart.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.knowledgehub=INFO

# Web — Network Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
